<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0a1825" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Page not found — Delta Voice</title>
<meta name="description" content="The page you were looking for could not be found. Head back to Delta Voice." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. DESIGN TOKENS  —  edit these to re-skin the whole site
   ============================================================ */
:root{
  /* Brand colours — DARK THEME with CREAM foreground */
  --navy:        #f4ecd7;   /* headings — warm cream */
  --navy-dark:   #050f1a;   /* deepest background (footer / process) */
  --teal:        #34a9c2;   /* primary teal accent */
  --teal-light:  #6fd3e3;   /* lighter teal */
  --teal-soft:   #11304a;   /* dark teal-tinted surface */
  --ink:         #efe6d2;   /* body text — cream off-white */
  --cream:       #f4ecd7;   /* cream foreground for text on dark panels */
  --muted:       #b1a78f;   /* secondary text — warm muted */
  --line:        #243a4f;   /* hairline borders on dark */
  --bg:          #0a1825;   /* page background (dark primary) */
  --bg-alt:      #0e1f30;   /* alternating section background (slightly lifted) */
  --surface:     #11263a;   /* card / panel surface */
  --panel-deep:  #0c1e30;   /* deep gradient start for hero card / compare / cta */
  --gold:        #e8b04b;   /* small warm accent (savings badge) */

  /* Type */
  --font-display: 'Sora', sans-serif;
  --font-body:    'Manrope', sans-serif;

  /* Layout */
  --maxw: 1180px;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 18px 50px -20px rgba(19,59,92,.28);
  --shadow-sm: 0 8px 24px -12px rgba(19,59,92,.25);
}

/* ============================================================
   2. RESET / BASE
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--bg);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.12;color:var(--navy);font-weight:700}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
section{padding:96px 0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

/* Section heading helper */
.eyebrow{
  font-family:var(--font-display);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:.72rem;
  font-weight:600;
  color:var(--teal);
  margin-bottom:14px;
  display:inline-block;
}
.section-head{max-width:680px;margin-bottom:54px}
.section-head h2{font-size:clamp(1.9rem,3.6vw,2.9rem);letter-spacing:-.02em}
.section-head.center{margin-left:auto;margin-right:auto;text-align:center}
.section-head p{color:var(--muted);font-size:1.08rem;margin-top:16px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--font-display);font-weight:600;font-size:.95rem;
  padding:14px 26px;border-radius:999px;cursor:pointer;border:1.5px solid transparent;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
}
.btn-primary{background:var(--teal);color:var(--cream);box-shadow:0 10px 26px -10px rgba(47,155,179,.7)}
.btn-primary:hover{background:#268498;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-light{background:#fff;color:#0a1825}
.btn-light:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.btn-outline-light{background:transparent;color:var(--cream);border-color:rgba(255,255,255,.4)}
.btn-outline-light:hover{background:rgba(255,255,255,.12)}

/* ============================================================
   3. HEADER / NAV
   ============================================================ */
header.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(10,24,37,.85);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  transition:transform .35s ease;
}
header.nav.nav-hidden{transform:translateY(-100%)}
.nav-inner{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 28px 10px}
.nav-row1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;gap:18px}
.nav-contact{display:flex;align-items:center;gap:16px;justify-self:start;min-width:0}
.nav-actions{display:flex;align-items:center;gap:12px;justify-self:end}
.brand{display:flex;align-items:center;gap:10px;justify-self:center}
.brand img{height:50px;width:auto}
.nav-links{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:nowrap}
.nav-links a{font-size:.88rem;font-weight:500;color:var(--ink);transition:color .2s;white-space:nowrap}
.nav-links a:hover{color:var(--teal)}
.nav-email{font-size:.85rem;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-toggle{display:none;background:none;border:0;cursor:pointer;font-size:1.5rem;color:var(--navy)}

/* ============================================================
   4. HERO
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(900px 500px at 78% -10%, rgba(94,197,214,.16), transparent 60%),
    radial-gradient(700px 600px at 0% 110%, rgba(52,169,194,.10), transparent 55%),
    var(--bg);
  padding:92px 0 70px;
}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--teal-soft);color:var(--ink);
  font-size:.8rem;font-weight:600;padding:8px 16px;border-radius:999px;
  margin-bottom:24px;
}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
.hero h1{font-size:clamp(2.3rem,4.8vw,3.7rem);letter-spacing:-.03em;font-weight:800}
.hero h1 span{color:var(--teal)}
.hero p.lede{font-size:1.15rem;color:var(--muted);margin:22px 0 30px;max-width:560px}
.hero-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 15px;border-radius:999px}
.tag::before{content:"✓";color:var(--teal);font-weight:800}

/* Hero card (consultation) */
.hero-card{
  background:linear-gradient(160deg,var(--panel-deep),var(--navy-dark));
  color:var(--cream);border-radius:var(--radius);padding:36px 32px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.hero-card::after{content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:rgba(94,197,214,.25);filter:blur(10px)}
.hero-card h3{color:var(--cream);font-size:1.5rem;margin-bottom:8px}
.hero-card p{color:rgba(220,210,185,.78);font-size:.97rem;margin-bottom:22px}
.hero-card .btn{width:100%;justify-content:center;margin-bottom:12px}
.hero-card-mail{display:block;text-align:center;font-size:.88rem;color:var(--teal-light);margin-top:8px}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:16px 18px}
.stat b{font-family:var(--font-display);font-size:1.7rem;color:var(--cream);display:block}
.stat span{font-size:.8rem;color:rgba(220,210,185,.7)}

/* ============================================================
   5. MARQUEE
   ============================================================ */
.marquee{background:var(--panel-deep);overflow:hidden;padding:18px 0;border-block:1px solid var(--line)}
.marquee-track{display:flex;gap:48px;white-space:nowrap;width:max-content;animation:scroll 28s linear infinite}
.marquee-track span{color:rgba(220,210,185,.85);font-family:var(--font-display);font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:48px}
.marquee-track span::after{content:"◆";color:var(--teal-light);font-size:.6rem}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ============================================================
   6. SERVICES
   ============================================================ */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:32px 28px;transition:transform .25s ease, box-shadow .25s ease, border-color .25s;
}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:transparent}
.card .ic{
  width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
  background:var(--teal-soft);color:var(--teal);margin-bottom:20px;
}
.card .ic svg{width:26px;height:26px}
.card h3{font-size:1.22rem;margin-bottom:10px}
.card p{color:var(--muted);font-size:.96rem;margin-bottom:18px}
.card a.more{font-family:var(--font-display);font-weight:600;font-size:.9rem;color:var(--teal);display:inline-flex;gap:6px;align-items:center}
.card a.more:hover{gap:11px}

/* ============================================================
   7. WHY US
   ============================================================ */
.why{background:var(--bg-alt)}
.why-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.feature{display:flex;gap:16px;margin-bottom:26px}
.feature .fic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--teal);color:#04141d;display:grid;place-items:center}
.feature .fic svg{width:22px;height:22px}
.feature h4{font-size:1.08rem;margin-bottom:4px}
.feature p{color:var(--muted);font-size:.94rem}

/* Pricing comparison card */
.compare{background:linear-gradient(160deg,var(--panel-deep),var(--navy-dark));border-radius:var(--radius);padding:36px;color:var(--cream);box-shadow:var(--shadow)}
.compare h4{color:var(--cream);font-size:1.25rem;margin-bottom:24px}
.compare-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.compare-row:last-of-type{border-bottom:0}
.compare-row .label{font-size:.95rem;color:rgba(220,210,185,.8)}
.compare-row .price{font-family:var(--font-display);font-size:1.35rem;font-weight:700}
.compare-row.highlight .price{color:var(--teal-light)}
.compare-badge{margin-top:22px;background:var(--gold);color:#3a2a05;font-family:var(--font-display);font-weight:700;text-align:center;padding:12px;border-radius:var(--radius-sm)}
.compare-badge span{display:block;font-weight:500;font-size:.8rem;opacity:.8}

/* ============================================================
   8. INDUSTRIES
   ============================================================ */
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chip{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:13px 22px;font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--ink);
  transition:.2s;
}
.chip:hover{background:var(--teal);color:#04141d;border-color:var(--teal)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.chip:hover .dot{background:var(--teal-light)}

/* ============================================================
   9. PROCESS
   ============================================================ */
.process{background:var(--navy-dark);color:var(--cream)}
.process .eyebrow{color:var(--teal-light)}
.process .section-head h2{color:var(--cream)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.step{position:relative;padding-top:14px}
.step .num{font-family:var(--font-display);font-size:2.6rem;font-weight:800;color:rgba(94,197,214,.35);line-height:1}
.step h4{color:var(--cream);font-size:1.12rem;margin:14px 0 8px}
.step p{color:rgba(220,210,185,.7);font-size:.93rem}

/* ============================================================
   10. TESTIMONIALS
   ============================================================ */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;transition:.25s}
.quote:hover{box-shadow:var(--shadow);transform:translateY(-4px)}
.quote .stars{color:var(--gold);margin-bottom:14px;letter-spacing:2px}
.quote p{font-size:1.02rem;color:var(--ink);margin-bottom:22px;font-style:italic}
.quote .who{display:flex;align-items:center;gap:13px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--teal);color:#04141d;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem}
.who b{display:block;font-family:var(--font-display);font-size:.97rem;color:var(--navy)}
.who span{font-size:.83rem;color:var(--muted)}

/* ============================================================
   11. CTA BANNER
   ============================================================ */
.cta-banner{
  background:
    radial-gradient(700px 400px at 85% 20%, rgba(94,197,214,.25), transparent 60%),
    linear-gradient(160deg,var(--panel-deep),var(--navy-dark));
  color:var(--cream);border-radius:24px;padding:64px 56px;text-align:center;position:relative;overflow:hidden;
}
.cta-banner h2{color:var(--cream);font-size:clamp(1.8rem,3.4vw,2.6rem);margin-bottom:16px;letter-spacing:-.02em}
.cta-banner p{color:rgba(220,210,185,.8);font-size:1.1rem;margin-bottom:30px;max-width:560px;margin-inline:auto}
.cta-banner .btn{margin:0 6px}

/* ============================================================
   12. CONTACT
   ============================================================ */
.contact-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:50px}
.contact-info .info-item{display:flex;gap:14px;margin-bottom:24px;align-items:flex-start}
.contact-info .iic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.contact-info .iic svg{width:20px;height:20px}
.contact-info h4{font-size:.95rem;margin-bottom:2px}
.contact-info p{color:var(--muted);font-size:.94rem}

/* Form tabs */
.form-tabs-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.form-tabs{display:flex;border-bottom:1px solid var(--line)}
.form-tab{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 20px;font-family:var(--font-display);font-size:.9rem;font-weight:600;
  color:var(--muted);background:transparent;border:none;cursor:pointer;
  transition:color .2s, background .2s, border-bottom .2s;
  border-bottom:3px solid transparent;
}
.form-tab:hover{color:var(--navy);background:rgba(255,255,255,.03)}
.form-tab.active{color:var(--teal);border-bottom-color:var(--teal);background:rgba(52,169,194,.06)}
.tab-panel{display:none;padding:28px}
.tab-panel.active{display:block}

form.lead{background:transparent;border:none;border-radius:0;padding:0;box-shadow:none}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.84rem;font-weight:600;color:var(--navy);margin-bottom:6px;font-family:var(--font-display)}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  font-family:var(--font-body);font-size:.95rem;color:var(--ink);background:var(--bg-alt);transition:.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);background:var(--bg-alt);box-shadow:0 0 0 4px rgba(52,169,194,.18)}
.field textarea{resize:vertical;min-height:110px}
.tab-panel .btn{width:100%;justify-content:center;margin-top:6px}
.form-note{font-size:.82rem;color:var(--muted);text-align:center;margin-top:14px}

/* ============================================================
   13. FOOTER
   ============================================================ */
footer{background:var(--navy-dark);color:var(--cream);padding:64px 0 28px}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.12)}
footer .brand img{height:56px}
.foot-about{color:rgba(220,210,185,.65);font-size:.95rem;margin-top:16px;max-width:300px}
footer h5{font-family:var(--font-display);font-size:.95rem;color:var(--cream);margin-bottom:16px;text-transform:uppercase;letter-spacing:.08em}
footer ul{list-style:none}
footer ul li{margin-bottom:10px}
footer ul li a{color:rgba(220,210,185,.65);font-size:.92rem;transition:.2s}
footer ul li a:hover{color:var(--teal-light)}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;flex-wrap:wrap;gap:10px}
.foot-bottom p{color:rgba(220,210,185,.5);font-size:.85rem}

/* ============================================================
   16. HERO 2.0 — floating nav / big hero / trust bar
   ============================================================ */
header.nav.nav-scrolled{
  background:rgba(10,24,37,.94);
  box-shadow:0 12px 30px -18px rgba(0,0,0,.6);
}
header.nav.nav-scrolled .nav-inner{padding-top:10px;padding-bottom:8px}
header.nav.nav-scrolled .brand img{height:42px}

.hero-top{max-width:760px;margin:0 auto 46px;text-align:center}
.hero-top .lede{margin-inline:auto}
.hero-top h1{font-size:clamp(2.5rem,5.2vw,4.2rem)}
.hero-cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.hero-cta-row .btn-primary svg{transition:transform .2s ease}
.hero-cta-row .btn-primary:hover svg{transform:translateX(3px)}

.hero-media{
  position:relative;border-radius:28px;overflow:hidden;
  aspect-ratio:16/7;
  background:
    radial-gradient(700px 400px at 15% 15%, rgba(94,197,214,.35), transparent 60%),
    radial-gradient(600px 500px at 90% 100%, rgba(232,176,75,.16), transparent 55%),
    linear-gradient(160deg,var(--panel-deep),var(--navy-dark));
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.hero-media-badge{
  position:absolute;top:22px;left:22px;z-index:2;
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.08);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.15);color:var(--cream);
  font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:999px;
}
.dot-live{width:8px;height:8px;border-radius:50%;background:#5be08a;animation:pulse-live 2s infinite}
@keyframes pulse-live{0%{box-shadow:0 0 0 0 rgba(91,224,138,.5)}70%{box-shadow:0 0 0 10px rgba(91,224,138,0)}100%{box-shadow:0 0 0 0 rgba(91,224,138,0)}}

.hero-media-graphic{position:absolute;inset:0;display:grid;place-items:center;opacity:.9}
.hero-waveform{display:flex;align-items:flex-end;gap:6px;height:64px}
.hero-waveform i{display:block;width:6px;border-radius:4px;transform-origin:bottom center;
  background:linear-gradient(180deg,var(--teal-light),var(--teal));animation:wave 1.6s ease-in-out infinite}
.hero-waveform i:nth-child(1){height:30%;animation-delay:0s}
.hero-waveform i:nth-child(2){height:60%;animation-delay:.1s}
.hero-waveform i:nth-child(3){height:100%;animation-delay:.2s}
.hero-waveform i:nth-child(4){height:45%;animation-delay:.3s}
.hero-waveform i:nth-child(5){height:80%;animation-delay:.4s}
.hero-waveform i:nth-child(6){height:35%;animation-delay:.5s}
.hero-waveform i:nth-child(7){height:65%;animation-delay:.6s}
@keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.hero-waveform i,.dot-live{animation:none}}

.hero-media-stats{position:absolute;left:22px;right:22px;bottom:22px;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hm-stat{background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 12px;text-align:center}
.hm-stat b{display:block;font-family:var(--font-display);font-size:1.2rem;color:var(--cream)}
.hm-stat span{font-size:.7rem;color:rgba(220,210,185,.75)}

/* Trust bar (progressive-blur style infinite slider) */
.trust-bar{background:var(--panel-deep);padding:32px 0;border-block:1px solid var(--line)}
.trust-bar-inner{display:flex;align-items:center;gap:28px}
.trust-label{flex:none;max-width:170px;font-size:.85rem;color:rgba(220,210,185,.75);border-right:1px solid var(--line);padding-right:24px}
.trust-slider{position:relative;flex:1;overflow:hidden;
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
}
.trust-track{display:flex;gap:44px;width:max-content;animation:scroll 26s linear infinite}
.trust-bar:hover .trust-track{animation-play-state:paused}
.trust-chip{display:inline-flex;align-items:center;gap:10px;color:rgba(220,210,185,.9);font-family:var(--font-display);font-weight:600;font-size:.92rem;white-space:nowrap}
.trust-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--teal-light)}

@media (max-width:980px){

  .hero-media-stats{grid-template-columns:repeat(2,1fr)}
}

   14. SCROLL REVEAL
   ============================================================ */

}
.reveal.in{opacity:1;transform:none;filter:blur(0)}

  .reveal{transition:none;opacity:1;transform:none;filter:none}
}

   ============================================================ */
@media (max-width:1180px){
  .nav-links{display:none}

  .nav-links.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:center;background:var(--bg);padding:20px 28px;border-bottom:1px solid var(--line);gap:16px}
}

/* ============================================================
   17. HERO POLISH — floating pill nav, depth, richer motion
   ============================================================ */

/* Floating nav card instead of full-bleed bar once scrolled */
header.nav.nav-scrolled{background:transparent;border-bottom-color:transparent;box-shadow:none}
header.nav.nav-scrolled .nav-inner{
  background:rgba(10,24,37,.86);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  margin:10px auto;
  max-width:calc(var(--maxw) - 20px);
  box-shadow:0 16px 40px -16px rgba(0,0,0,.55);
  padding-top:10px;padding-bottom:8px;
}
header.nav.nav-scrolled .brand img{height:40px;transition:height .3s ease}

/* Depth: dot-grid texture + glow orbs inside the media panel */
.hero-media{isolation:isolate}
.hero-media::before{
  content:"";position:absolute;inset:0;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:radial-gradient(700px 380px at 50% 40%, #000 40%, transparent 85%);
  -webkit-mask-image:radial-gradient(700px 380px at 50% 40%, #000 40%, transparent 85%);
}
.hero-media::after{
  content:"";position:absolute;z-index:0;width:260px;height:260px;border-radius:50%;
  right:-70px;bottom:-90px;background:rgba(232,176,75,.14);filter:blur(50px);
}
.hero-media-graphic{z-index:1}
.hero-media-badge{z-index:2;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.hero-media-stats{z-index:2}

/* Pulse ring behind the waveform for more visual interest */
.hero-waveform{position:relative}
.hero-waveform::before{
  content:"";position:absolute;left:50%;top:50%;width:130px;height:130px;
  transform:translate(-50%,-50%);border-radius:50%;
  border:1px solid rgba(94,197,214,.25);
  animation:ring-pulse 2.6s ease-out infinite;
}
@keyframes ring-pulse{0%{transform:translate(-50%,-50%) scale(.6);opacity:.7}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero-waveform::before{animation:none}}

/* Extra waveform bars for a fuller look */
.hero-waveform i:nth-child(8){height:50%;animation-delay:.7s}
.hero-waveform i:nth-child(9){height:25%;animation-delay:.8s}

/* Stat chips: gentle hover lift */
.hm-stat{transition:transform .2s ease, background .2s ease, border-color .2s ease}
.hm-stat:hover{transform:translateY(-3px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}

/* Trust chips as soft pills, with hover */
.trust-chip{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  padding:9px 16px;border-radius:999px;transition:background .2s ease, border-color .2s ease, transform .2s ease;
}
.trust-chip:hover{background:rgba(255,255,255,.1);border-color:rgba(94,197,214,.35);transform:translateY(-2px)}

/* Slightly richer entrance for the media panel */
.hero-media{animation:media-in .8s cubic-bezier(.16,1,.3,1) both;animation-delay:.15s}
@keyframes media-in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-media{animation:none}}

/* Tighter, punchier eyebrow pill on the hero */
.hero-top .pill{box-shadow:0 6px 18px -10px rgba(52,169,194,.5)}


/* ============================================================
/* ============================================================
   18. TESTIMONIAL STAGE — split layout, interactive person rail
   ============================================================ */
.testi-stage{
  display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:stretch;
  margin-top:12px;
}

/* ---- Left: selectable person rail ---- */
.testi-rail{display:flex;flex-direction:column;gap:10px}
.testi-person{
  position:relative;display:flex;align-items:center;gap:13px;width:100%;
  background:transparent;border:1px solid transparent;border-radius:14px;
  padding:13px 15px;cursor:pointer;text-align:left;overflow:hidden;
  font-family:var(--font-body);
  transition:background .3s ease, border-color .3s ease, transform .3s ease;
}
.testi-person:hover{background:rgba(255,255,255,.04);border-color:var(--line);transform:translateX(3px)}
.testi-person.is-active{background:var(--surface);border-color:rgba(52,169,194,.45)}
.testi-person .avatar{
  width:44px;height:44px;flex:none;
  filter:grayscale(1);opacity:.55;transition:filter .35s ease, opacity .35s ease, transform .35s ease;
}
.testi-person.is-active .avatar{filter:none;opacity:1;transform:scale(1.06)}
.tp-meta{min-width:0}
.tp-meta b{
  display:block;font-family:var(--font-display);font-size:.95rem;
  color:var(--muted);transition:color .3s ease;
}
.testi-person.is-active .tp-meta b{color:var(--cream)}
.tp-meta span{
  display:block;font-size:.79rem;color:var(--muted);opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* autoplay progress line on the active person */
.tp-progress{
  position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:linear-gradient(90deg,var(--teal),var(--teal-light));
  transform:scaleX(0);transform-origin:left center;opacity:0;
}
.testi-person.is-active .tp-progress{opacity:1}
.testi-person.is-active.is-running .tp-progress{
  transition:transform var(--testi-dur,5s) linear;transform:scaleX(1);
}

/* ---- Right: featured quote panel ---- */
.testi-feature{
  position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--surface),var(--panel-deep));
  border:1px solid var(--line);border-radius:24px;
  padding:44px 46px 38px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  min-height:330px;
  cursor:grab;
}
.testi-feature:active{cursor:grabbing}
.testi-feature::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 300px at 88% 8%, rgba(52,169,194,.16), transparent 62%);
}
.testi-feature::after{
  content:"\201C";position:absolute;top:-26px;right:26px;pointer-events:none;
  font-family:var(--font-display);font-size:13rem;line-height:1;
  color:var(--teal);opacity:.12;
}
.tf-inner{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.tf-stars{color:var(--gold);letter-spacing:3px;margin-bottom:20px;font-size:1.05rem}
.tf-quote{
  font-family:var(--font-display);font-weight:500;
  font-size:clamp(1.2rem,2.1vw,1.62rem);line-height:1.5;
  color:var(--cream);margin:0 0 26px;
}
/* word-by-word entrance */
.tf-quote .w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(4px)}
.tf-quote.play .w{animation:word-in .5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes word-in{to{opacity:1;transform:none;filter:blur(0)}}

.tf-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.tf-who{display:flex;align-items:center;gap:13px;min-width:0}
.tf-who .avatar{width:48px;height:48px;flex:none}
.tf-who b{display:block;font-family:var(--font-display);font-size:1rem;color:var(--cream)}
.tf-who span{font-size:.84rem;color:var(--muted)}
.tf-nav{display:flex;align-items:center;gap:10px}
.tf-count{font-family:var(--font-display);font-size:.85rem;color:var(--muted);letter-spacing:1px;margin-right:4px}
.tf-count b{color:var(--teal-light);font-weight:700}
.tf-arrow{
  width:42px;height:42px;border-radius:50%;flex:none;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--cream);cursor:pointer;display:grid;place-items:center;padding:0;
  transition:background .2s ease,border-color .2s ease,transform .2s ease;
}
.tf-arrow:hover{background:rgba(52,169,194,.18);border-color:var(--teal);transform:scale(1.08)}
.tf-arrow:focus-visible{outline:2px solid var(--teal-light);outline-offset:3px}
.testi-person:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}

/* transition state while swapping quotes */
.testi-feature.swapping .tf-inner{opacity:0;transform:translateY(10px);transition:opacity .22s ease, transform .22s ease}
.tf-inner{transition:opacity .4s ease, transform .4s ease}

@media (max-width:940px){
  .testi-stage{grid-template-columns:1fr;gap:22px}
  .testi-rail{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;scrollbar-width:none}
  .testi-rail::-webkit-scrollbar{display:none}
  .testi-person{flex:0 0 auto;min-width:210px}
  .testi-feature{padding:34px 26px 28px;min-height:0}
  .testi-feature::after{font-size:9rem;top:-18px;right:14px}
}
@media (prefers-reduced-motion:reduce){
  .tf-quote .w,.testi-person,.tf-inner,.tp-progress{animation:none!important;transition:none!important}
  .tf-quote .w{opacity:1;transform:none;filter:none}
}


/* Skip link — keyboard users jump past the nav */
.skip-link{
  position:absolute;left:-9999px;top:0;z-index:999;
  background:var(--teal);color:#04141d;font-family:var(--font-display);font-weight:700;
  padding:12px 20px;border-radius:0 0 10px 0;text-decoration:none;
}
.skip-link:focus{left:0}

/* ============================================================
   19. FAQ ACCORDION
   ============================================================ */
.faq-list{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.faq-item{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;

.faq-ic{
  flex:none;width:28px;height:28px;border-radius:50%;

  transition:transform .35s cubic-bezier(.16,1,.3,1), background .3s ease, border-color .3s ease;
}

.faq-a p{padding:0 24px 22px;color:var(--ink);font-size:.98rem;line-height:1.7;margin:0;opacity:.9}

/* ============================================================
   20. WHATSAPP BUTTON + STICKY MOBILE CTA
   ============================================================ */
.wa-float{
  position:fixed;right:20px;bottom:20px;z-index:60;
